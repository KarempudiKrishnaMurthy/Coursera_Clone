server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: coursehub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Application & Security Properties (all driven by environment variables)
app:
  jwt:
    secret: ${JWT_SECRET:CourseHubSuperSecretKeyForJWTTokenSigningMustBe256BitsLong2024!}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000} # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    cookie-secure: ${JWT_COOKIE_SECURE:false} # false for local dev (HTTP), true for production (HTTPS)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Actuator metrics & health
management:
  endpoints:
    web:
      exposure:
        include: health,info
